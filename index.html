<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <h1>odin library app</h1>
  <button id="open-form-btn" class="btn btn-primary">Add New Book</button>
  
  <div id="book-container" class="card-grid"></div>
  
  <div id="form-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Add a New Book</h2>
      <form id="add-book-form" novalidate>

        <div class="form-control">
          <label for="author">Author:</label>
          <input type="text" id="author" required minlength="2">
          <span class="error" id="author-error"></span>
        </div>

        <div class="form-control">
          <label for="title">Title:</label>
          <input type="text" id="title" required minlength="1">
          <span class="error" id="title-error"></span>
        </div>

        <div class="form-control">
          <label for="pages">Number of Pages:</label>
          <input type="number" id="pages" required minlength="1">
          <span class="error" id="pages-error"></span>
        </div>

        <div class="form-control">
          <label for="year">Published Year:</label>
          <input type="number" id="year" required min="1000" max="2026">
          <span class="error" id="year-error"></span>
        </div>

        <div class="form-control">
          <label for="read">Read:</label>
          <select id="read" required>
            <option value="" disabled selected>Select status</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
          </select>
          <span class="error" id="read-error"></span>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save Book</button>
          <button type="button" id="close-form-btn" class="btn btn-secondary">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="./script.js"></script>
</body>

</html>
