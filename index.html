<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <h1>odin library app</h1>
  <button id="open-form-btn" class="btn btn-primary">Add New Book</button>
  <id id="book-container" class="card-grid"></id>
  <div id="form-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Add a New Book</h2>
      <form id="add-book-form">
        <label for="author">Author:</label>
        <input type="text" id="author" required>

        <label for="title">Title:</label>
        <input type="text" id="title" required>

        <label for="pages">Number of Pages:</label>
        <input type="number" id="pages" required>

        <label for="year">Published Year:</label>
        <input type="number" id="year" required>

        <label for="read">Read:</label>
        <select id="read" required>
          <option value="" disabled selected>Select status</option>
          <option value="Yes">Yes</option>
          <option value="No">No</option>
        </select>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save Book</button>
          <button type="button" id="close-form-btn" class="btn btn-secondary">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="./script.js"></script>
</body>

</html>
